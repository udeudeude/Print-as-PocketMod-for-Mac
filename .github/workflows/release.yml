name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Build on Intel so the same runner can cross-compile both Intel and
    # Apple Silicon slices, then combine them into one universal app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Read and validate version
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          TAG="v$VERSION"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=dist/Print-as-PocketMod-for-Mac-v$VERSION.zip" >> "$GITHUB_ENV"

      - name: Validate
        run: |
          plutil -lint Resources/Info.plist
          zsh -n scripts/install.sh
          zsh -n scripts/uninstall.sh
          zsh -n scripts/package-release.sh

      - name: Test with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build universal app
        run: |
          X86_BUILD=".build-release-x86_64"
          ARM_BUILD=".build-release-arm64"

          swift build -c release --arch x86_64 --product PocketModApp --build-path "$X86_BUILD"
          swift build -c release --arch arm64 --product PocketModApp --build-path "$ARM_BUILD"

          X86_DIR="$(swift build -c release --arch x86_64 --build-path "$X86_BUILD" --show-bin-path)"
          ARM_DIR="$(swift build -c release --arch arm64 --build-path "$ARM_BUILD" --show-bin-path)"
          UNIVERSAL_BINARY="$RUNNER_TEMP/PocketModApp-universal"

          lipo -create "$X86_DIR/PocketModApp" "$ARM_DIR/PocketModApp" -output "$UNIVERSAL_BINARY"

          ARCHS="$(lipo -archs "$UNIVERSAL_BINARY")"
          echo "Universal architectures: $ARCHS"
          [[ "$ARCHS" == *x86_64* ]]
          [[ "$ARCHS" == *arm64* ]]
          echo "UNIVERSAL_BINARY=$UNIVERSAL_BINARY" >> "$GITHUB_ENV"

      - name: Package
        run: POCKETMOD_BUILD="$UNIVERSAL_BINARY" zsh scripts/package-release.sh

      - name: Verify packaged installer
        run: |
          test -f "$ASSET"
          VERIFY_DIR="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ASSET" "$VERIFY_DIR"

          DIST="$VERIFY_DIR/Print-as-PocketMod-for-Mac-v$VERSION"
          APP="$DIST/Print as PocketMod.app"
          test -x "$APP/Contents/MacOS/PocketModApp"
          test -x "$DIST/Install.command"
          test -x "$DIST/Uninstall.command"
          zsh -n "$DIST/Install.command"
          zsh -n "$DIST/Uninstall.command"

          ARCHS="$(lipo -archs "$APP/Contents/MacOS/PocketModApp")"
          [[ "$ARCHS" == *x86_64* ]]
          [[ "$ARCHS" == *arm64* ]]
          codesign --verify --deep --strict "$APP"

          PACKAGED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          test "$PACKAGED_VERSION" = "$VERSION"

          INSTALL_HOME="$RUNNER_TEMP/release-install-home"
          rm -rf "$INSTALL_HOME"
          mkdir -p "$INSTALL_HOME"
          HOME="$INSTALL_HOME" zsh "$DIST/Install.command"

          test -x "$INSTALL_HOME/Applications/Print as PocketMod.app/Contents/MacOS/PocketModApp"
          test -x "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          test -x "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          zsh -n "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          zsh -n "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          grep -q 'MODE=--plain' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          grep -q 'MODE=--guides' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          grep -q -- '--args "$MODE"' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"

      - name: Publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Print as PocketMod $VERSION

          Reliable mixed-orientation PocketMod imposition, oversized-square handling without Desktop-folder access, optional fold/cut guides, temporary-output cleanup, and a universal Intel/Apple-Silicon double-click installer."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Print as PocketMod $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --title "Print as PocketMod $TAG" --notes "$NOTES"
          fi
