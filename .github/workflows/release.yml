name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Build on Intel so the same runner can cross-compile both Intel and
    # Apple Silicon slices, then combine them into one universal app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Read and validate version
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=dist/Print-as-PocketMod-for-Mac-v$VERSION.zip" >> "$GITHUB_ENV"

      - name: Validate
        run: |
          plutil -lint Resources/Info.plist
          zsh -n scripts/install.sh
          zsh -n scripts/uninstall.sh
          zsh -n scripts/package-release.sh

      - name: Test with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build universal app
        run: |
          X86_BUILD=".build-release-x86_64"
          ARM_BUILD=".build-release-arm64"

          swift build -c release --arch x86_64 --product PocketModApp --build-path "$X86_BUILD"
          swift build -c release --arch arm64 --product PocketModApp --build-path "$ARM_BUILD"

          X86_DIR="$(swift build -c release --arch x86_64 --build-path "$X86_BUILD" --show-bin-path)"
          ARM_DIR="$(swift build -c release --arch arm64 --build-path "$ARM_BUILD" --show-bin-path)"
          UNIVERSAL_BINARY="$RUNNER_TEMP/PocketModApp-universal"

          lipo -create "$X86_DIR/PocketModApp" "$ARM_DIR/PocketModApp" -output "$UNIVERSAL_BINARY"

          ARCHS="$(lipo -archs "$UNIVERSAL_BINARY")"
          echo "Universal architectures: $ARCHS"
          [[ "$ARCHS" == *x86_64* ]]
          [[ "$ARCHS" == *arm64* ]]
          echo "UNIVERSAL_BINARY=$UNIVERSAL_BINARY" >> "$GITHUB_ENV"

      - name: Package
        run: POCKETMOD_BUILD="$UNIVERSAL_BINARY" zsh scripts/package-release.sh

      - name: Verify downloadable package
        run: |
          test -f "$ASSET"
          VERIFY_DIR="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ASSET" "$VERIFY_DIR"

          DIST="$VERIFY_DIR/Print as PocketMod $VERSION"
          APP="$DIST/.payload/Print as PocketMod.app"
          INSTALLER="$DIST/Install Print as PocketMod.command"
          UNINSTALLER="$DIST/Uninstall Print as PocketMod.command"

          test -f "$DIST/START HERE.html"
          test -f "$DIST/LICENSE.txt"
          test -x "$APP/Contents/MacOS/PocketModApp"
          test -x "$INSTALLER"
          test -x "$UNINSTALLER"
          zsh -n "$INSTALLER"
          zsh -n "$UNINSTALLER"

          ARCHS="$(lipo -archs "$APP/Contents/MacOS/PocketModApp")"
          [[ "$ARCHS" == *x86_64* ]]
          [[ "$ARCHS" == *arm64* ]]
          codesign --verify --deep --strict "$APP"

          PACKAGED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          test "$PACKAGED_VERSION" = "$VERSION"

          INSTALL_HOME="$RUNNER_TEMP/release-install-home"
          rm -rf "$INSTALL_HOME"
          mkdir -p "$INSTALL_HOME"
          HOME="$INSTALL_HOME" zsh "$INSTALLER"

          test -x "$INSTALL_HOME/Applications/Print as PocketMod.app/Contents/MacOS/PocketModApp"
          test -x "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          test -x "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          zsh -n "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          zsh -n "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          grep -q 'PREFIX="plain"' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          grep -q 'PREFIX="guides"' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"
          grep -q 'open -n -a "$APP" "$STAGED"' "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"

          HOME="$INSTALL_HOME" zsh "$UNINSTALLER"
          test ! -e "$INSTALL_HOME/Applications/Print as PocketMod.app"
          test ! -e "$INSTALL_HOME/Library/PDF Services/Print as PocketMod"
          test ! -e "$INSTALL_HOME/Library/PDF Services/Print as PocketMod with Guides"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Print as PocketMod $VERSION

          INSTALL
          Download the ZIP, unzip it, and open START HERE.html. Then double-click “Install Print as PocketMod.command”.

          If macOS cannot verify the developer, Control-click or right-click the installer, choose Open, then choose Open again.

          COMPATIBILITY
          macOS 13 or later. Universal Intel + Apple Silicon build.

          This release is ad-hoc signed but not Apple-notarized."

          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Print as PocketMod $TAG" \
            --notes "$NOTES"
