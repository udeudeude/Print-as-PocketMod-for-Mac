name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=dist/Print-as-PocketMod-for-Mac-v$VERSION.zip" >> "$GITHUB_ENV"

      - name: Validate
        run: |
          plutil -lint Resources/Info.plist
          zsh -n scripts/install.sh
          zsh -n scripts/uninstall.sh
          zsh -n scripts/package-release.sh

      - name: Build and test
        run: |
          swift test
          swift build -c release --product PocketModApp

      - name: Package
        run: zsh scripts/package-release.sh

      - name: Verify package
        run: |
          test -f "$ASSET"
          VERIFY_DIR="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ASSET" "$VERIFY_DIR"

          DIST="$VERIFY_DIR/Print-as-PocketMod-for-Mac-v$VERSION"
          test -x "$DIST/Print as PocketMod.app/Contents/MacOS/PocketModApp"
          test -x "$DIST/Install.command"
          test -x "$DIST/Uninstall.command"
          zsh -n "$DIST/Install.command"
          zsh -n "$DIST/Uninstall.command"

          grep -q 'MODE=--plain' "$DIST/Install.command"
          grep -q 'MODE=--guides' "$DIST/Install.command"
          grep -q -- '--args "$MODE"' "$DIST/Install.command"

          PACKAGED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$DIST/Print as PocketMod.app/Contents/Info.plist")"
          test "$PACKAGED_VERSION" = "$VERSION"

      - name: Publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Print as PocketMod $VERSION

          Adds reliable mixed-orientation PocketMod imposition, oversized-square handling without Desktop-folder access, optional fold/cut guides, temporary-output cleanup, and a prebuilt double-click installer."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Print as PocketMod $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --title "Print as PocketMod $TAG" --notes "$NOTES"
          fi
